[pytest]
# Every scheme ships a package literally named `src`
# (Schemes/*/src/__init__.py), so pytest's default "prepend" import mode
# derives the same top-level module name `src` for all four. Whichever one is
# imported first wins and the rest fail collection with
# "No module named 'src.test_...'" — which silently skipped the whole
# zhuang_lattice_mabse suite in any repo-root pytest invocation.
#
# importlib mode derives a unique module name per file and never mutates
# sys.path, so the four `src` packages coexist.
addopts = --import-mode=importlib
testpaths = Common Schemes Dataset
