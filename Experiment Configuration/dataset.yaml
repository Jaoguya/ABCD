# =============================================================================
# dataset.yaml — Corpus construction parameters
# =============================================================================
# Read by Dataset/prepare_dataset.py and Dataset/synthetic_generator.py.
# Keeping these here (rather than as CLI defaults) means changing the corpus
# shape requires no code change.
#
# CHANGING ANY VALUE HERE IS RESULTS-AFFECTING once results generation has
# begun — README §14 forbids modifying the derived dataset after that point.
# =============================================================================

meta:
  version: 1

# -----------------------------------------------------------------------------
# Corpus shape — README §4 and §6
# -----------------------------------------------------------------------------
corpus:
  # Sweep range for Exp. 2 (searchable index size N).
  min_records: 10000                  # 10^4   — README §4
  max_records: 1000000                # 10^6   — README §4
  default_records: 100000             # 10^5   — README §6 (benchmark choice)
  domains: 4                          # README §6, Paper §V
  domain_split: uniform               # README §4 "Uniform across 4 domains"

  # Domain assignment is a deterministic function of the patient identifier,
  # not a per-record coin flip. This keeps every record of one patient inside
  # a single administrative domain, which is what "administrative healthcare
  # domain" means, and makes the split reproducible across runs.
  domain_assignment: hash_of_patient_id

# -----------------------------------------------------------------------------
# Synthea extraction — Dataset/prepare_dataset.py
# -----------------------------------------------------------------------------
# Synthea (MITRE) generates synthetic patient records from epidemiologically
# grounded disease modules. Apache 2.0, no credentialing, and the generator
# is peer-reviewed and citable:
#
#   Walonoski et al., "Synthea: An approach, method, and software mechanism
#   for generating synthetic patients and the synthetic electronic health
#   care record", JAMIA 25(3), 2018. doi:10.1093/jamia/ocx079
#
# THIS IS NOT THE SAME AS Dataset/synthetic_generator.py. That script draws
# keywords from a fitted Zipf law with no clinical structure and is barred
# from reportable results. Synthea produces module-driven co-occurrence
# (a diabetes condition really does pull metformin), is openly licensed, and
# is citable — so it is a reportable corpus. Keep the distinction clear when
# reading corpus_type in a manifest.
synthea:
  # Point --input at Synthea's CSV export directory (output/csv/).
  export_format: csv
  # One derived record == one clinical encounter.
  record_unit: encounter

  tables:
    encounters: encounters.csv
    conditions: conditions.csv
    medications: medications.csv
    procedures: procedures.csv

  # Codes rather than free-text DESCRIPTION: codes are the controlled
  # vocabulary a real searchable index would be built over, and they avoid a
  # keyword universe inflated by description wording variants.
  keyword_sources:
    - table: conditions
      field: CODE
      prefix: "cond:"        # SNOMED CT
      enabled: true
    - table: medications
      field: CODE
      prefix: "med:"         # RxNorm
      enabled: true
    - table: procedures
      field: CODE
      prefix: "proc:"        # SNOMED CT
      enabled: true

  keyword_filter:
    min_document_frequency: 5
    max_document_frequency_ratio: 0.5
    max_keywords_per_record: 32
    normalize: lowercase_strip

  timestamp_field: START
  join_key: ENCOUNTER

  # Domains come from the ORGANIZATION that created the encounter — a real
  # institutional boundary, not a hash of the patient. This makes cross-domain
  # search (Exp. 3) reflect genuine multi-institution structure: one patient
  # seen at two organisations really does have records in two domains, which
  # is what "administrative healthcare domain" is supposed to mean.
  #
  # Overrides corpus.domain_assignment above, which is the fallback for
  # sources with no institutional field.
  domain_assignment: hash_of_organization

# -----------------------------------------------------------------------------
# Synthetic corpus — Dataset/synthetic_generator.py
# -----------------------------------------------------------------------------
# DEVELOPMENT ONLY. README §4: results from the synthetic corpus MUST NOT be
# reported in the paper. Every corpus records its type, and run_meta.json
# carries corpus_type so a synthetic run can never be mistaken for a real one.
synthetic:
  # Keyword frequency in clinical corpora is heavy-tailed. A Zipf law is the
  # standard model and is what the SSE literature uses for synthetic indexes.
  #
  # These values are placeholders until a Synthea corpus exists. Once
  # prepare_dataset.py has run once, it writes the OBSERVED distribution into
  # dataset_manifest.json, and synthetic_generator.py --match-profile <manifest>
  # will reproduce it instead of using the values below.
  distribution: zipf
  zipf_exponent: 1.2                  # benchmark: placeholder, see above
  keyword_universe_size: 20000        # benchmark: placeholder, see above
  keywords_per_record:
    distribution: lognormal
    mean: 12.0                        # benchmark: ~typical ICD codes/admission
    sigma: 0.5
    min: 1
    max: 32                           # matches synthea.keyword_filter cap

  # Fixed seed so the development corpus is byte-reproducible across machines.
  # This seeds corpus CONTENT only — never cryptographic key material.
  seed: 20260803

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  # Written to the --output directory (default Dataset/derived, git-ignored).
  corpus_filename: corpus.jsonl
  manifest_filename: dataset_manifest.json
  # SHA-256 of corpus_filename is recorded in the manifest and in every
  # run_meta.json (README §7).
  hash_algorithm: sha256
