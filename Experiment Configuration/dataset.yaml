# =============================================================================
# dataset.yaml — Corpus construction parameters
# =============================================================================
# Read by Dataset/prepare_dataset.py and Dataset/synthetic_generator.py.
# Keeping these here (rather than as CLI defaults) means changing the corpus
# shape requires no code change.
#
# CHANGING ANY VALUE HERE IS RESULTS-AFFECTING once results generation has
# begun — README §14 forbids modifying the derived dataset after that point.
# =============================================================================

meta:
  version: 1

# -----------------------------------------------------------------------------
# Corpus shape — README §4 and §6
# -----------------------------------------------------------------------------
corpus:
  # Sweep range for Exp. 2 (searchable index size N).
  min_records: 10000                  # 10^4   — README §4
  max_records: 1000000                # 10^6   — README §4
  default_records: 100000             # 10^5   — README §6 (benchmark choice)
  domains: 10                         # raised from 4 on 2026-08-28 so Exp. 3 can
                                      # sweep its published d=2..10 range
  domain_split: uniform               # README §4 "Uniform across 4 domains"

  # Domain assignment is a deterministic function of the patient identifier,
  # not a per-record coin flip. This keeps every record of one patient inside
  # a single administrative domain, which is what "administrative healthcare
  # domain" means, and makes the split reproducible across runs.
  domain_assignment: hash_of_patient_id

# -----------------------------------------------------------------------------
# Synthea extraction — Dataset/prepare_dataset.py
# -----------------------------------------------------------------------------
# Synthea (MITRE) generates synthetic patient records from epidemiologically
# grounded disease modules. Apache 2.0, no credentialing, and the generator
# is peer-reviewed and citable:
#
#   Walonoski et al., "Synthea: An approach, method, and software mechanism
#   for generating synthetic patients and the synthetic electronic health
#   care record", JAMIA 25(3), 2018. doi:10.1093/jamia/ocx079
#
# THIS IS NOT THE SAME AS Dataset/synthetic_generator.py. That script draws
# keywords from a fitted Zipf law with no clinical structure and is barred
# from reportable results. Synthea produces module-driven co-occurrence
# (a diabetes condition really does pull metformin), is openly licensed, and
# is citable — so it is a reportable corpus. Keep the distinction clear when
# reading corpus_type in a manifest.
synthea:
  # Point --input at Synthea's CSV export directory (output/csv/).
  export_format: csv
  # One derived record == one clinical encounter.
  record_unit: encounter

  tables:
    encounters: encounters.csv
    conditions: conditions.csv
    medications: medications.csv
    procedures: procedures.csv
    observations: observations.csv
    immunizations: immunizations.csv
    allergies: allergies.csv
    devices: devices.csv
    careplans: careplans.csv
    imaging_studies: imaging_studies.csv

  # WHAT IS AND IS NOT A LEGITIMATE KEYWORD SOURCE
  # ----------------------------------------------
  # Every source below is a DISTINCT clinical concept that a real encrypted
  # EHR index would contain. Two things are deliberately excluded because
  # they would inflate the keyword universe without adding real distinctions,
  # which would pump n_eff and flatter Exp. 2 (README §14):
  #
  #   * free-text DESCRIPTION alongside CODE — the same concept, aliased
  #   * value binning finer than the bins below — granularity for its own sake
  #
  # The vocabulary must be FIXED ONCE, before any reportable run, and applied
  # identically to all five schemes. Treat it like the lambda weights.
  keyword_sources:
    - table: conditions
      field: CODE
      prefix: "cond:"        # SNOMED CT
      enabled: true
    - table: medications
      field: CODE
      prefix: "med:"         # RxNorm
      enabled: true
    - table: procedures
      field: CODE
      prefix: "proc:"        # SNOMED CT
      enabled: true

    # Observations are the largest vocabulary contributor. A raw numeric value
    # would give every record a unique keyword and exercise no index at all,
    # so values are quantile-binned per code: obs:8867-4:b3 is "heart rate,
    # third quintile". This is how a searchable index makes a continuous
    # measurement queryable, not a trick to widen the universe.
    - table: observations
      field: CODE
      prefix: "obs:"         # LOINC
      enabled: true
      value_binning:
        enabled: true
        value_field: VALUE
        bins: 5              # benchmark: quintiles. Fixed once, see above.

    - table: immunizations
      field: CODE
      prefix: "imm:"         # CVX
      enabled: true
    - table: allergies
      field: CODE
      prefix: "alg:"         # SNOMED CT / RxNorm
      enabled: true
    # Device codes are genuinely device-originated data, which is the closest
    # Synthea comes to IoMT telemetry.
    - table: devices
      field: CODE
      prefix: "dev:"         # SNOMED CT
      enabled: true
    - table: careplans
      field: CODE
      prefix: "plan:"        # SNOMED CT
      enabled: true
    - table: imaging_studies
      field: BODYSITE_CODE
      prefix: "img:"         # SNOMED CT body site
      enabled: true

  keyword_filter:
    min_document_frequency: 5
    max_document_frequency_ratio: 0.5
    # A record with fewer keywords than the query size can never match a
    # conjunctive q-keyword query. The manuscript fixes q=5 (§VI, "each query
    # contains five keywords"), and the first corpus build had a median
    # |W_i| of 4 — 55% of records were structurally unmatchable at the
    # default query size, padding the index with entries that could never be
    # returned. Must stay >= the largest q used in a search experiment.
    min_keywords_per_record: 5
    # Raised from 32 when observations were added: with nine sources a single
    # encounter routinely exceeds 32 keywords, and a cap that binds on most
    # records would flatten the |W_i| distribution and with it the spread in
    # n_eff that Exp. 2 measures. RESULTS-AFFECTING — do not retune per run.
    max_keywords_per_record: 64
    normalize: lowercase_strip

  timestamp_field: START
  join_key: ENCOUNTER

  # Domains come from the ORGANIZATION that created the encounter — a real
  # institutional boundary, not a hash of the patient. Whole organizations are
  # then packed into domains largest-first so the domains come out near-equal.
  #
  # Hashing each organization independently was tried first and gave a
  # 34/21/23/22 split, because organization sizes are heavy-tailed. That
  # contradicts §VI ("uniformly distributed across four administrative
  # healthcare domains") and would confound Exp. 8, which reports the standard
  # deviation of FSN utilization — corpus imbalance would read as scheduler
  # imbalance.
  #
  # Organizations stay intact, so a domain remains a real institutional
  # boundary and one patient seen at two organizations genuinely spans two
  # domains, which is what Exp. 3 exercises.
  domain_assignment: balanced_organizations

# -----------------------------------------------------------------------------
# Synthetic corpus — Dataset/synthetic_generator.py
# -----------------------------------------------------------------------------
# DEVELOPMENT ONLY. README §4: results from the synthetic corpus MUST NOT be
# reported in the paper. Every corpus records its type, and run_meta.json
# carries corpus_type so a synthetic run can never be mistaken for a real one.
synthetic:
  # Keyword frequency in clinical corpora is heavy-tailed. A Zipf law is the
  # standard model and is what the SSE literature uses for synthetic indexes.
  #
  # These values are placeholders until a Synthea corpus exists. Once
  # prepare_dataset.py has run once, it writes the OBSERVED distribution into
  # dataset_manifest.json, and synthetic_generator.py --match-profile <manifest>
  # will reproduce it instead of using the values below.
  distribution: zipf
  zipf_exponent: 1.2                  # benchmark: placeholder, see above
  keyword_universe_size: 20000        # benchmark: placeholder, see above
  keywords_per_record:
    distribution: lognormal
    mean: 12.0                        # benchmark: ~typical ICD codes/admission
    sigma: 0.5
    min: 1
    max: 32                           # matches synthea.keyword_filter cap

  # Fixed seed so the development corpus is byte-reproducible across machines.
  # This seeds corpus CONTENT only — never cryptographic key material.
  seed: 20260803

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  # Written to the --output directory (default Dataset/derived, git-ignored).
  corpus_filename: corpus.jsonl
  manifest_filename: dataset_manifest.json
  # SHA-256 of corpus_filename is recorded in the manifest and in every
  # run_meta.json (README §7).
  hash_algorithm: sha256

# -----------------------------------------------------------------------------
# FREEZE — generate the corpus ONCE, then pin it
# -----------------------------------------------------------------------------
# The corpus is built once and reused by every scheme on every instance.
# Regenerating it mid-campaign produces two incomparable result sets that
# surface only when a reviewer asks why two run_meta.json files disagree
# (README §14: do not modify the derived dataset once results generation has
# begun).
#
# Three things enforce this rather than relying on discipline:
#   1. prepare_dataset.py REFUSES to overwrite an existing corpus without
#      --force, so re-running it by accident is a no-op.
#   2. Every scheme calls Dataset.corpus.verify_corpus() at startup, which
#      fails if the corpus does not match its manifest.
#   3. The pin below, once set, fails if the manifest itself was replaced.
#
# HOW TO FREEZE: run prepare_dataset.py once, then copy the corpus_sha256
# from Dataset/dataset_manifest.json into the field below and commit it.
# Leave it null until then — verification is skipped while unset.
freeze:
  # Frozen 2026-08-04. Synthea 7e08387, 38,000 patients, seed 20260804,
  # clinician seed 20260804, min_keywords_per_record=5, balanced domains.
  #   records                1,141,072
  #   keyword universe       2,006 distinct
  #   keyword/document pairs 36,172,487
  #   |W_i| min/median/mean  5 / 29 / 31.70
  #   per-domain split       285,268 x 4 (exact)
  #   fitted Zipf exponent   2.7078
  #
  # Supersedes SHA-256 d991c695... (1,206,159 records), which had a median
  # |W_i| of 4 against q=5 — 55% of its records could never match a default
  # conjunctive query — and uneven domains (34/21/23/22) contradicting §VI's
  # "uniformly distributed". Archived at ~/corpus_v1_archive/ on the
  # experiment host; never used for results.
  # RE-FROZEN 2026-08-28 onto corpus v3.
  #
  # v2 (fd4b7654..., 1,141,072 records, frozen 2026-08-04) existed only on an
  # instance that was terminated, and the corpus is git-ignored, so it is gone.
  # Regenerating with the documented recipe -- same Synthea commit 7e08387,
  # same seeds (-s 20260804 -cs 20260804), same 38,000 patients, same export
  # flags -- produced 7a4e6835..., NOT a byte-identical v2. Synthea generates
  # patients across threads, so a fixed seed pins the random stream but not
  # which patient consumes which draw; the recipe is therefore reproducible in
  # shape but not in bytes. Regenerating again would yield a fourth distinct
  # digest, not v2, so re-pinning is the only terminating option.
  #
  # Nothing is invalidated: no results.csv or run_meta.json was ever produced
  # against v2 (checked on both instances before it was lost). v3 satisfies
  # every property v2 was chosen for -- corpus_type synthea, min |W_i| = 5
  # against the published q=5, and domains balanced exactly (285,948 x 4).
  # It differs from v2 only in the ways thread interleaving would predict:
  # 1,143,792 records (v2: 1,141,072), 2,023 keywords (2,006), Zipf 2.741
  # (2.7078).
  #
  # The raw Synthea CSVs are preserved at ~/synthea/output_full/csv in AMI
  # ami-0feb3b14b4ea27844: re-running prepare_dataset.py over THOSE fixed CSVs
  # is deterministic (the non-determinism is in Synthea's generation, not in
  # extraction), so v3 is re-derivable as long as that AMI survives.
  # SUPERSEDED 2026-08-28 by v4 (10 domains) -- see below.
  #   v3: 7a4e6835... 4 domains, 285,948 x 4
  expected_corpus_sha256: e56ca2d14b3b6438a231fa9d00c5970a91cd0085879fa214092efbb7f707d6a0
  frozen_on: 2026-08-28
  # Set false only for local development runs against the synthetic corpus.
  require_reportable_corpus: true
