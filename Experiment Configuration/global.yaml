# =============================================================================
# global.yaml — Benchmark-wide defaults for ALL schemes
# =============================================================================
# The single source of truth for the default parameters and measurement
# methodology. Every scheme reads these; NO scheme may override them ("Bias
# Detection": no per-scheme parameter tuning — all schemes use identical
# global.yaml defaults).
#
# AUTHORITY. `Overleaf/MA-LB-PQ-VDSE.tex` §VI is what `published` means; this
# file is synced to it, most recently 2026-09-07. skill.md is
# the operator's guide and carries the rest of the reasoning. (skill.md was
# deleted 2026-09-07; comments below no longer cite it.)
#
# Provenance key for every entry below:
#   published  — stated in the manuscript's §VI
#   fips       — fixed by a standard
#   benchmark  — a benchmark choice; NOT specified in any paper
#
# CHANGING A VALUE HERE IS RESULTS-AFFECTING and invalidates the results.csv
# files measured under the old one. Record any change in the scheme documents and, if
# it moves a number, in `.claude/skills/bug-sweep/the scheme documents.
#
# DELIBERATELY PERMISSIVE. Sweeps are the points the FIGURES draw, not a
# whitelist: a scheme may measure a superset (several baselines already do) and
# the extra points stay in its results.csv. Nothing here refuses to run — the
# only hard gate in the repo is what may be REPORTED, and that lives in
# `corpus.reportable_types` and provenance.py, not in the sweep definitions.
# =============================================================================

meta:
  version: 2
  created: 2026-08-08
  updated: 2026-09-07          # synced against Overleaf/MA-LB-PQ-VDSE.tex §VI
  # Hash of this file is recorded in every run_meta.json. Plots/generate_plots.py
  # warns when two schemes in one figure carry different hashes.

# -----------------------------------------------------------------------------
# Experiment defaults — §VI "Unless otherwise specified". Each experiment
# varies ONE of these and holds the rest at the values below.
# -----------------------------------------------------------------------------
defaults:
  keywords_per_query: 5         # published: §VI "each query contains five keywords"
  domains: 4                    # published: §VI "four administrative healthcare domains"
  fog_search_nodes: 4           # published: §VI "Four Fog Search Nodes and one cloud server"
  index_size: 100000            # benchmark: 10^5, mid-point of the Exp. 2 sweep 10^4-10^6
  returned_results: 100         # benchmark: mid-point of the Exp. 4 sweep 10-1000

# -----------------------------------------------------------------------------
# Measurement methodology — §VI.
# -----------------------------------------------------------------------------
measurement:
  # REDUCED 30 -> 10 on the user's instruction, 2026-09-03. Section VI was
  # updated to match on the same day and now reads "repeated 10 times"; this
  # value and that sentence must be changed together or the manuscript states
  # a replication count the data does not have.
  repetitions: 10               # published: §VI "repeated 10 times"
  confidence_interval: 0.95     # published: §VI "95% confidence intervals"
  warmup_runs: 5                # benchmark: discarded, not counted in the 10
  clock:
    latency: perf_counter_ns    # published: §VI monotonic ns clock
    throughput: wall_clock      # benchmark: throughput needs elapsed real time
  latency_unit: ms              # results.csv column unit
  size_unit: KB                 # results.csv column unit
  throughput_unit: queries_per_second  # results.csv column unit
  # §VI: keep outliers. A failed run is recorded status=failed and RE-RUN to
  # restore n=`repetitions`; it is never dropped to make the sample cleaner.
  drop_outliers: false
  cache_state: warm             # published: §VI Exp. 1-6 warm; Exp. 7-8 after the ramp

# -----------------------------------------------------------------------------
# Experiment sweeps — the ranges §VI states. The variable column of each
# experiment; every other parameter stays at `defaults` above. A scheme MAY
# measure more points than are listed; the figure draws these.
# -----------------------------------------------------------------------------
experiments:
  exp1_trapdoor_generation:
    variable: keywords_per_query
    # published: §VI Exp. 1 "q\in\{1,5,10,15,20\}" -- a SET of five values, not
    # the range 1..20. The old comment paraphrased it as "1 to 20", which reads
    # as every integer and is how the four baselines came to be measured at all
    # 20. Their extra points are a superset and stay in results.csv; the figure
    # draws these five (generate_plots.py: ExperimentSpec.restrict_x).
    values: [1, 5, 10, 15, 20]
    # THE |P_U| SWEEP WAS REMOVED on the user's instruction 2026-09-13.
    # Exp. 1 swept q AND the authorization scope, one `pu<N>` arm per
    # |P_U| in {1,2,4,8}, so the proposed scheme drew four curves in Fig. 1
    # against each baseline's one. It now sweeps q alone and writes a single
    # exp1_trapdoor_generation/, like every other scheme.
    #
    # RESULTS-AFFECTING: the four arm directories are gone and Exp. 1 was
    # re-measured. |P_U| is unchanged in the CONSTRUCTION -- a token binds one
    # policy, so a user authorized under n policies still needs n tokens per
    # keyword -- it is simply no longer a measured dimension. §VI was updated
    # in the same pass.
    #
    # Consequence worth knowing: tab:cost's O(|T_Q|)T_H row had its only
    # structural check against data in test_cost_table_agreement.py, which
    # needs two |P_U| arms to reach one |T_Q| by two factorizations. That test
    # now skips and says so.
    policy_scopes: [1]
    schemes: [ma_lb_pq_vdse, guo_vdsse, thingom_pq_abse, perera_lv_pqabse, yue_ge]
  exp2_search_latency:
    variable: index_size
    # published: §VI "searchable indexes containing 10^4--10^6 EHRs". N counts
    # RECORDS, not index entries — every baseline slices `records[:N]`, and the
    # figure's x-axis reads "(records)". The proposed scheme divided N by
    # |W_i| until 2026-09-07 and searched a 32x smaller corpus at the same x.
    values: [10000, 50000, 100000, 500000, 1000000]
    schemes: [ma_lb_pq_vdse, guo_vdsse, thingom_pq_abse, perera_lv_pqabse, yue_ge]
  exp3_crossdomain_scalability:
    variable: domains
    values: [2, 4, 6, 8, 10]                      # published: §VI "2 to 10"
    # PUBLISHED CONVENTION, benchmark VALUE. SVI Exp. 3: "The query size and
    # per-domain index size are fixed to isolate cross-domain search overhead."
    # PER-DOMAIN, not total -- so total data GROWS with d and each domain's
    # shard stays the same size at every point.
    #
    # The five schemes previously held OPPOSITE quantities constant: all four
    # baselines fixed TOTAL at 100,000 and sharded by d, so per-domain SHRANK
    # 50,000 -> 10,000 and Scheme 35's latency FELL as d grew; the proposed
    # scheme fixed per-domain at 4 records. A 2,500x data disparity on one axis,
    # with the curve directions set by the two sizing rules rather than by the
    # schemes.
    #
    # The VALUE is a benchmark choice (SVI states the convention, not the
    # number): 10,000 keeps total at 100,000 when d=10, which is what the
    # baselines already indexed, so the campaign cost is unchanged.
    # RESULTS-AFFECTING: the banked baseline Exp. 3 results PREDATE this and
    # were measured under the fixed-total rule.
    held_constant:
      per_domain_index_size: 10000                # benchmark: see above
    schemes: [ma_lb_pq_vdse, guo_vdsse, thingom_pq_abse, perera_lv_pqabse, yue_ge]
  exp4_verification_overhead:
    variable: returned_results
    values: [10, 50, 100, 500, 1000]              # published: §VI "10 to 1000"
    # yue_ge = Peony++ = Scheme [30] in the current manuscript (it was cited as
    # Scheme 30 before the 2026-09-06 re-sync; §VI now reads
    # "Scheme~\cite{ref30} (Peony++)"). Added to Exp. 4 on 2026-08-28 -- it has
    # a scheme-native Verify, so Exp. 4 has a third participant.
    #
    # Ref[41] has no result-verification primitive at all.
    #
    # Ref[54] DOES have one: Algorithm 3 `retrieve_verify` -- ML-DSA-65
    # signature verification, Merkle inclusion, and a freshness check against
    # the latest on-chain root.
    #
    # DECIDE-1 (2026-09-03) kept it OUT pending two blockers. Both are cleared
    # as of 2026-09-04 and it is now IN:
    #
    #   1. `retrieve_verify` rebuilt the whole partition tree per call (O(N),
    #      not the O(log N) Table II claims), plus a linear leaf lookup.
    #      `finalize()` now retains the tree it already builds and
    #      `verify_record` proves against it: measured flat at 0.777 ms/call
    #      from N=500 to N=4000, path length 9 -> 12 (= log2 N).
    #   2. The Exp. 4 boundary excludes fetch and decryption, but Algorithm 3
    #      does verification AND hybrid key reconstruction in one call.
    #      `scheme.verify_record` is its verification half alone and is what
    #      the runner times, so Ref[54]'s number covers the same work as every
    #      other arm's. `retrieve_verify` still performs both halves.
    # ---- Arm `granularity` -- SVI Fig. 4(b) ----------------------------------
    # FOLDED IN 2026-09-12. This was `exp9_verification_granularity`, an
    # experiment number Section VI does not define: the paper has one Experiment
    # 4 making a two-part claim, drawn as a two-panel figure. Panel (a) sweeps
    # `r` and asks what verification COSTS; panel (b) pins `r` and sweeps the
    # tamper count `t`, asking what it BUYS. Two sweeps, so two arms of one
    # experiment rather than two experiments.
    #
    # Scheme 35 and Scheme 30 verify with a single accumulator over the complete
    # result set, so a failure is all-or-nothing -- the batch is discarded and no
    # record can be named. Ours verifies a Merkle path per record, so the failed
    # records are identified and excised. That contrast is the panel.
    #
    # t = 0 is deliberately NOT swept: the figure is log-log and the no-tamper
    # case is arm (a). src/tests pin the t=0 behaviour instead.
    tamper_values: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]
    held_constant:
      returned_results: 20000
    schemes: [ma_lb_pq_vdse, guo_vdsse, yue_ge, perera_lv_pqabse]
  exp5_keyword_update:
    variable: keyword_document_pairs
    values: [100, 1000, 10000, 100000]            # published: §VI "10^2-10^5"
    # perera_lv_pqabse (Ref[54]) excluded 2026-08-27: no incremental-update
    # primitive in the paper -- indexes are (re)built at Phase 3, no
    # standalone update algorithm to measure.
    # yue_ge (Scheme [30], Peony++) added 2026-08-28: has a native incremental
    # Add (new batch appended, nothing rewritten), which is what Exp. 5 measures.
    schemes: [ma_lb_pq_vdse, guo_vdsse, yue_ge]
  exp6_authorization_sync:
    # CHANGED 2026-09-11 to the variable §VI actually states. Exp. 6 reads
    # "the fraction of policies affected by an authority-state update increases
    # from 10% to 100%" -- a RATIO, not an update count. The old
    # `authorization_updates` axis (10^2-10^5) was divergence D8: the three arms
    # corresponded but the x-axis did not, so banked Exp. 6 data could not be
    # plotted against the manuscript's stated axis at all.
    #
    # RESULTS-AFFECTING for the proposed scheme only. No baseline runs Exp. 6
    # (see `schemes:` below), so no baseline result is invalidated.
    variable: affected_policy_ratio
    values: [0.1, 0.25, 0.5, 0.75, 1.0]           # published: §VI "10% to 100%"
    # perera_lv_pqabse (Ref[54]) excluded 2026-08-27: the paper explicitly
    # self-discloses NO fine-grained/immediate revocation, only coarse
    # epoch-based key evolution (whole-epoch invalidation, not per-update
    # sync) -- using it here would claim a capability it doesn't have, the
    # same mistake already caught and fixed for Ref[41]'s PQ claim. Was
    # excluded.
    #
    # No baseline: Exp. 6 is a proposed-scheme-only ablation, like Exp. 7-8.
    # A baseline here needs a fine-grained authorization-sync primitive, and
    # Ref[54] explicitly disclaims having one. Any candidate must be
    # IEEE-published -- see .claude/skills/reference-vetting.
    schemes: [ma_lb_pq_vdse]
  exp7_search_throughput:
    variable: concurrency
    # EXTENDED 2026-09-01 from [100, 500, 1000, 2500, 5000]; 10000 was ADDED
    # and every original point KEPT. The AASS advantage on cross-node forwards
    # only opens up above ~500 concurrent queries, and the low end is where it
    # is weakest -- dropping those points would make a scalability result a
    # cherry-picked one.
    # RESOLVED 2026-09-07: §VI now states the full range ("concurrent search
    # ... 10,000", and Exp. 8 "as concurrent queries increase from 100 to
    # 10,000"), so this is `published`, no longer an extension awaiting text.
    values: [100, 500, 1000, 2500, 5000, 10000]
    schemes: [ma_lb_pq_vdse]                      # scheduler ablation, see scheduler.yaml
  exp8_load_balance:
    variable: concurrency
    # EXTENDED 2026-09-01 -- same range as Exp. 7, whose runs it shares.
    values: [100, 500, 1000, 2500, 5000, 10000]
    schemes: [ma_lb_pq_vdse]
    # Exp. 7 and Exp. 8 are DERIVED FROM THE SAME RUNS. Run the
    # trace once per variant and emit both metric sets.
    shares_runs_with: exp7_search_throughput
    secondaries: [max_node_utilization, cross_node_forwards, max_queue_depth]
    # THE ORDER IS THE PANEL ORDER. Section VI's Fig. 8 is (a) utilization std.
    # dev. = primary, (b) max FSN utilization = secondary_1, (c) cross-node
    # forwards = secondary_2, and Plots/generate_plots.py indexes panels
    # positionally. Reordering this list silently relabels a panel.
    #
    # `cross_node_forwards` was dropped 2026-08-30 as invariant -- the scheduler
    # returned ONE node per request and forwards were counted per authorized
    # domain, giving k-1 under every variant (600 for all four arms over 400
    # requests). Restored 2026-09-07 with Algorithm 1 implemented per SHARD:
    # `aass` applies the published `S notin S_j -> continue` guard and scores 0
    # by construction, the three oblivious variants do not. RESULTS-AFFECTING:
    # every banked exp8_load_balance/ result predates this and has only two
    # secondary columns, so its secondary_2 is max_queue_depth, NOT forwards.
    # Exp. 7-8 ramp: §VI "a 30-second ramp that is excluded" -- applied once per
    # sweep point in setup, which run_point() excludes from every timing.
    ramp_seconds: 30

# -----------------------------------------------------------------------------
# Topology — §VI. Four FSNs + one cloud server, one VPC/AZ.
# Each FSN is an INDEPENDENT PROCESS holding its own index shard, VID_j, and
# request queue. No runtime state is shared between FSNs.
# -----------------------------------------------------------------------------
topology:
  fog_search_nodes: 4           # published: §VI; must equal defaults.fog_search_nodes
  cloud_servers: 1              # published: §VI "one cloud server"
  independent_processes: true   # published: §VI deploys FSNs as independent processes
  # Phases I-II create FSNs as in-process objects (untimed setup). The process
  # split lands with Phase VI, before any Exp. 2/7/8 measurement.
  utilization_sample_interval_ms: 100   # benchmark: Exp. 7-8 sampling rate

# -----------------------------------------------------------------------------
# Multi-authority topology — proposed scheme only.
# NOT IN THE PAPER: §VI fixes d=4 domains, m=4 FSNs and q=5 but never states
# N_AA or |A_i|. Fixed here by team decision on 2026-08-08 so that Phase I/II
# is reproducible; both values are `benchmark`, not `published`.
# -----------------------------------------------------------------------------
authorities:
  count: 4                      # benchmark: one AA per administrative domain (§VI's d=4)
  attributes_per_authority: 10  # benchmark: NOT from our paper. Matches the only
                                # attribute count present in the configs
                                # (Ref[52] published l=10, crypto.yaml), so the
                                # proposed scheme is not given a smaller
                                # attribute universe than the baseline it is
                                # compared against.
  authority_to_domain: one_to_one  # benchmark: AA_i manages domain Dom_i
  disjoint_attribute_universes: true  # published: Phase II Step 2 requires it
  initial_vid: 0                # benchmark: paper defines VID' = VID + 1
                                # (Phase VII Step 3) but not the initial value.

# -----------------------------------------------------------------------------
# Environment — §VI. RECORDED into run_meta.json rather than enforced: the
# campaign deliberately rents more than one instance size, so a hard pin here
# would refuse legitimate runs. Provenance carries what we actually ran on.
# -----------------------------------------------------------------------------
environment:
  # instance_type: DROPPED on the user's instruction, 2026-08-30. It pinned
  # m6i.xlarge, which guo's Exp. 2 cannot satisfy -- its forward index needs
  # ~52 GB at N=10^6 against a 16 GiB host -- and which caps thingom's Exp. 2
  # at 4 vCPU. Both now run on hosts sized for the work, and §VI discloses the
  # host per scheme instead of claiming one type for all five.
  #
  # Absence is a supported STATE, not a missing key: verify_experiment_host()
  # reports pin_configured=false and satisfies host_check_satisfied vacuously,
  # so reportability no longer gates on a pin that does not exist. It still
  # records detected_instance_type and metadata_reachable in every
  # run_meta.json -- with nothing to compare against, recording what we
  # actually ran on matters MORE, not less. Restore the pin by uncommenting.
  #
  # instance_type: m6i.xlarge
  #
  # vcpus/memory_gb described the pinned host and would now be false: the
  # campaign rents r6i.8xlarge and r6i.32xlarge. Nothing reads them; they are
  # kept as documentation of what the 85 banked run_metas were measured on.
  vcpus_of_banked_corpus: 4       # historical: the m6i.xlarge all 85 banked runs used
  memory_gb_of_banked_corpus: 16  # historical: as above
  # §VI names Ubuntu but not a point release, and the current AMI
  # (ami-0b2da6ed17be6c7a1) is 24.04 LTS while the banked runs were on 22.04.
  # Recorded, not enforced -- run_meta.json carries the real platform string.
  os: ubuntu                    # 22.04 for the banked runs; 24.04 on the current AMI
  python: "3.11"
  # numpy claims all cores by default, which would make the lattice baseline's
  # latency depend on core count. provision.sh exports these. §VI states the
  # pinning and lists all five variables.
  blas_threads: 1
  thread_env_vars:
    - OMP_NUM_THREADS
    - OPENBLAS_NUM_THREADS
    - MKL_NUM_THREADS
    - NUMEXPR_NUM_THREADS
    - VECLIB_MAXIMUM_THREADS

# -----------------------------------------------------------------------------
# Fleet — how the campaign is parallelised. Added 2026-08-29.
#
# Campaign wall-clock is bounded by the largest INDIVISIBLE unit of work, not by
# instance count. Splitting one scheme per instance leaves it at 25.0h (guo's
# whole track); splitting one experiment per instance leaves it at 17.5h
# (ma_lb Exp. 7-8); splitting by sweep point with `--points` reaches 11.2h,
# bounded by guo_vdsse Exp. 2's single N=10^6 index build, which grows one index
# across nested prefixes and is therefore sequential.
#
# NOTE ON SIZE: 14 nodes and 8 nodes both finish in 11.24h. The bound is one
# 11.24h job, and total compute is 74.4h, so anything above ceil(74.4/11.24) = 7
# nodes only adds idle time -- at 14 nodes, 13 of them finish in ~4.9h and sit
# idle for ~83 instance-hours. That is free if each node is terminated when its
# work ends, and ~$16 of waste if the fleet is left up. Sized at 14 by decision
# for scheduling headroom; drop to 8 to halve the idle.
# -----------------------------------------------------------------------------
fleet:
  nodes: 14
  # instance_type: DROPPED with environment.instance_type above. Keeping it
  # here would recreate the contradiction it was dropped to remove -- one line
  # asserting every node is identical while the campaign deliberately rents
  # two different sizes. Per-scheme hosts are recorded in each run_meta.json,
  # which is now the only claim about hardware this repo makes.
  # instance_type: m6i.xlarge
  placement: one cluster placement group, same AZ
  granularity: sweep_point      # see infra/sweep.py
  expected_wall_clock_h: 11.2
  total_compute_h: 74.4
  terminate_when_done: true     # idle nodes bill; the plan leaves 13 idle early
  merge_step: infra/merge_points.py   # required -- shards are not results


# -----------------------------------------------------------------------------
# Paths — load-bearing for Plots/generate_plots.py. Relative to the repo root.
# -----------------------------------------------------------------------------
paths:
  dataset: Dataset/derived
  schemes: Schemes
  plots_output: Plots/output
  config_dir: "Experiment Configuration"

# -----------------------------------------------------------------------------
# Corpus — only `synthea` is reportable. `synthetic` is a fitted Zipf law with
# no clinical structure and is development-only.
#
# THIS ONE STAYS STRICT, deliberately. Everything else in this file is
# permissive, but widening `reportable_types` would let invented data be
# stamped reportable, which is the one failure the provenance chain exists to
# prevent. Loosen it only for a local dev run, never on a campaign host.
# The SHA-256 pin itself lives in dataset.yaml and is verified at startup.
# -----------------------------------------------------------------------------
corpus:
  type: synthea
  reportable_types: [synthea]
  verify_sha256_on_load: true
