# =============================================================================
# crypto.yaml — Cryptographic parameters for ALL schemes
# =============================================================================
# Single source of truth for every cryptographic parameter in the benchmark.
# Read by Common/crypto/*; never hardcode these values in scheme source.
#
# Provenance key for every entry below:
#   published  — the value is stated in the scheme's own paper (cite line)
#   fips       — fixed by a standard (FIPS 203, FIPS 197, FIPS 180-4)
#   benchmark  — a benchmark choice; NOT specified in any paper (§VI (defaults))
#
# CHANGING ANY VALUE HERE IS RESULTS-AFFECTING. Per needfix.md, do not edit
# without team consensus, and record the change in the SystemConfiguration.md Change Log.
# =============================================================================

meta:
  version: 1
  # Hash of this file is recorded in every run_meta.json (§VI (methodology)).

# -----------------------------------------------------------------------------
# Global primitives — identical for every scheme, so that cross-scheme latency
# differences come from the constructions and not from the primitive layer.
# §VI (testbed): "Environment parity is part of the result."
# -----------------------------------------------------------------------------
global:
  hash:
    algorithm: sha256                 # fips: FIPS 180-4
    digest_bits: 256
  aead:
    algorithm: aes-256-gcm            # fips: FIPS 197 + SP 800-38D
    key_bits: 256
    nonce_bits: 96                    # SP 800-38D recommended nonce size
    tag_bits: 128
  prf:
    algorithm: hmac-sha256            # fips: FIPS 198-1
    key_bits: 256
  kdf:
    algorithm: hkdf-sha256
    info_prefix: "MA-LB-PQ-VDSE/v1"

# -----------------------------------------------------------------------------
# ML-KEM-768 — proposed scheme only (§VI (testbed)).
# Exp. 1 EXCLUDES encapsulation from the trapdoor curve; it is a one-time
# session-establishment cost reported separately (§VI (experiments), Exp. 1 rule).
# -----------------------------------------------------------------------------
kem:
  algorithm: ml-kem-768               # fips: FIPS 203
  # Informational only — fixed by FIPS 203, not tunable.
  encapsulation_key_bytes: 1184
  decapsulation_key_bytes: 2400
  ciphertext_bytes: 1088
  shared_secret_bytes: 32

# -----------------------------------------------------------------------------
# ma_lb_pq_vdse — the PROPOSED scheme.
#
# Added 2026-08-08. Purely ADDITIVE: no existing value in this file changed, so
# no existing baseline result is affected (and the proposed scheme has produced
# no results yet).
#
# Phase I Step 1 specifies an ASYMMETRIC (Type-III) pairing
#   e : G_1 x G_2 -> G_T
# over prime-order groups with generators g_1 in G_1, g_2 in G_2
# (Overleaf/PQ-AVDSE-OJCOMS:362ff), consistent with §VI (testbed) "Type-III for our
# MA-CP-ABE". This is the OPPOSITE setting to Ref[41] above, which publishes a
# Type-I symmetric map — the two must not share a backend.
# -----------------------------------------------------------------------------
ma_lb_pq_vdse:
  pairing:
    type: type-3                      # published: e : G_1 x G_2 -> G_T
    backend: charm_type3              # benchmark: charm-crypto is already built
                                      # and verified on the experiment host
                                      # (debug_history 2026-08-04), so this adds
                                      # no new dependency.
    curve: BN254                      # benchmark: the paper specifies a Type-III
                                      # pairing but no curve. BN254 is chosen for
                                      # security parity with the rest of the
                                      # scheme; charm's Type-III MNT curves
                                      # (MNT159 ~80-bit) would sit far below
                                      # ML-KEM-768 and AES-256.
    curve_fallback: MNT224            # benchmark: ONLY if the host charm build
                                      # ships no BN254 parameters. Must be
                                      # confirmed on the host and recorded
                                      # before any reportable run — not
                                      # selected silently.
    # A Type-I backend must NEVER be substituted here: it would change group
    # element sizes and pairing cost, and it contradicts the published map.
    allow_symmetric_backend: false
    # IMPLEMENTED 2026-08-28. Common/crypto/pairing.py now exposes
    # CharmType3Backend alongside CharmSS512Backend (Type-I) and
    # PetrelicBN254Backend (Type-III, still does not build). Verified on the
    # host at BN254: G1 serialises to 46 B and G2 to 90 B (genuinely distinct
    # groups, not a symmetric stand-in), and bilinearity
    # e(g1^a, g2^c) == e(g1, g2)^(ac) holds.
    #
    # Known library behaviour, recorded so it is not rediscovered as a bug:
    # charm does NOT reject pair(g2, g1) on this curve, it accepts the reversed
    # argument order. The differing element sizes settle that the groups are
    # distinct; it just means the library will not catch an argument-order
    # mistake, so the construction must get the order right itself.
    backend_implemented: true

  # MA-CP-ABE master keys — Phase I Step 2:
  #   MSK_i = (alpha_i, beta_i),  alpha_i, beta_i <-$ Z_p
  #   PK_i  = ( g_1, g_2, e(g_1,g_2)^{alpha_i}, g_1^{beta_i} )
  abe:
    master_key_components: [alpha, beta]   # published: Phase I Step 2
    public_key_components: [g1, g2, "e(g1,g2)^alpha", "g1^beta"]  # published
    # e(g_1,g_2) is computed once at global initialisation and reused by every
    # authority, so N_AA authorities cost N_AA exponentiations and ONE pairing.
    precompute_pairing_generator: true     # benchmark

  # Hash H used for the authorization-state commitment C_i^auth (Phase II
  # Step 3), the policy-bound keyword token T_j (Phase IV Step 2), and
  # AuthRoot_U (Phase III Step 4). §VI: "SHA-256 for hashing and Merkle-tree
  # construction".
  hash_output_bits: 256                    # published: §VI
  # Every || in the published equations is realised as a length-prefixed join
  # (Common/crypto/hashes.py::_join), so H(a||b) cannot collide with H(a'||b')
  # under a different field split. No measurable cost; removes a real ambiguity.
  length_prefixed_concatenation: true      # benchmark

# -----------------------------------------------------------------------------
# Ref[35] — Guo et al., IEEE TDSC 2024
# Source: References/Ref[35].txt:1756-1766
#   "we implemented the hash functions and PRFs with SHA256 and HMAC based on
#    SHA256 ... the t-Pun-PRF was constructed by two HMACs based on SHA256 and
#    Blake2b ... security parameter lambda is configured with 128; the output
#    of the hash function is 192 bits"
#
# NOTE: the VBTree height L=32 mentioned on Ref[35].txt:1764 belongs to the
# COMPARED scheme of Wu et al. [15] (see Ref[35].txt:1807), NOT to Guo's own
# construction. It is deliberately absent here.
# -----------------------------------------------------------------------------
guo_vdsse:
  security_parameter_lambda: 128      # published: Ref[35].txt:1763
  hash_output_bits: 192               # published: Ref[35].txt:1763-1764
  prf: hmac-sha256                    # published: Ref[35].txt:1756
  puncturable_prf:
    # published: Ref[35].txt:1758 — "constructed by two HMACs based on
    # SHA256 and Blake2b". The two HMACs instantiate the two child-derivation
    # functions of the GGM tree (left=SHA256, right=Blake2b).
    left_hmac: hmac-sha256
    right_hmac: hmac-blake2b
    # benchmark: the GGM domain |X|. CHANGED 128 -> 64 on 2026-08-29.
    # [results-affecting for guo_vdsse Exp. 2, 4, 5]
    #
    # NOT PUBLISHED. Ref[35] defines the t-Pun-PRF abstractly -- "Ft: K x X ->
    # Y ... Ft.Punc(k, S) where S subset of X" (Ref[35].txt:370-382) -- and
    # never fixes |X| anywhere. The only numeric parameters it publishes are
    # lambda = 128 and a 192-bit hash output (:1763-1764). The "height L = 32"
    # on the same line belongs to the COMPARED VBTree scheme, not to Guo's own
    # (§VI (baselines) already flags that trap).
    #
    # 128 came from reading "GGM tree depth = |X| in bits" off lambda = 128.
    # That conflates two different quantities: lambda is the KEY length, |X| is
    # the DOMAIN the punctured points live in. The domain only has to hold
    # F2(w) for the distinct keywords -- 2,023 in corpus v4 -- for which a
    # 64-bit domain gives a collision bound of ~1e-13.
    #
    # The repo's own precedent settles the sizing rule: yue_ge's MSRE derives
    # its GGM domain from the space it actually addresses
    # (msre.domain_bits_for(array_bits) = 15 bits for a 19,171-bit Bloom
    # filter) and its docstring says so explicitly -- "not some wider fixed
    # domain ... instead of paying for a tree covering an address space the
    # scheme never touches". guo at 128 was the sole outlier, 8.5x deeper than
    # the only other punctured-PRF scheme here, while addressing a SMALLER
    # space. 64 is still 4x deeper than yue_ge's, i.e. deliberately conservative.
    #
    # WHY IT MATTERS, measured on the pinned host: guo's forward index stores a
    # punctured key per document, sized O(|W_id| * log|X|). At 128 bits and
    # corpus v4's 31.7 keywords/document that is 138.2 KB per document --
    # 14.15 GB at N = 10^5, which OOM-killed every guo experiment in the
    # 2026-08-28 campaign (rc=137, anon-rss 15.67 GB on a 16 GiB host). At 64
    # bits it is 50.5 KB/document, 5.17 GB at N = 10^5.
    #
    # CONTEXT FROM THE PAPER'S OWN EVALUATION: Ref[35] ran on "8 cores and
    # 112 GB of memory" (:1754) over a dataset of 517,399 files / 1,989,805
    # keyword-document pairs -- 3.85 keywords per document. Corpus v4 has
    # 31.70, i.e. 8.2x denser per document, and this index is linear in that.
    # At our density even the paper's own 112 GB machine could not have held
    # N = 10^6 at 128 bits (141 GB).
    #
    # DISCLOSE IN §VI: guo's punctured-PRF domain is sized to the keyword
    # universe rather than to lambda, as Ref[55]'s is; this makes guo FASTER on
    # Exp. 2/4/5 than a 128-bit domain would. The decision was taken on the
    # grounds above, before any cross-scheme result was known.
    domain_bits: 64
    output_bits: 192                  # published: matches hash_output_bits
  symmetric_encryption: aes-256-gcm   # benchmark: paper says "SE", unspecified
  verification_tag_bits: 256           # benchmark: F2/F3 output = full HMAC-SHA256
                                       # F2 feeds domain encoding + forward-index mask;
                                       # F3 feeds XOR-accumulated verification tags.
                                       # Both use the global PRF (HMAC-SHA256 → 256 bits).


# -----------------------------------------------------------------------------
# Ref[41] — Thingom et al., IEEE TCE 2026
# Source: References/Ref[41].txt:510-513
#   "two multiplicative cyclic groups I1 and I2 of prime order w, with i and h
#    as generators of I1. A bilinear map is defined as e : I1 x I1 -> I2"
#
# This is a TYPE-I (symmetric) pairing. Security rests on DBDH
# (Ref[41].txt:280-300). Implemented AS PUBLISHED per needfix.md — do not
# "upgrade" it to a post-quantum or Type-III setting.
# -----------------------------------------------------------------------------
thingom_pq_abse:
  pairing:
    type: type-1                      # published: e : I1 x I1 -> I2
    backend: charm_ss512              # benchmark: symmetric curve, Linux only
    curve: SS512
    # Dev-only fallback for machines without charm-crypto. NOT reportable:
    # it is a Type-III curve and changes group-element sizes and pairing cost.
    #
    # UNUSABLE FOR THIS SCHEME IN PRACTICE. Ref[41] pairs two elements of the
    # same group everywhere (e(i,i) in setup, e(CS_3j, L_1z) in search); a
    # Type-III backend has no such operation, so the first pairing raises.
    # main.py refuses it with that explanation rather than letting it fail
    # inside the library. Ref[41] needs charm-crypto to run AT ALL, not only
    # to run reportably. Kept here so get_backend()'s refusal path stays
    # exercised by test_primitives.py.
    dev_fallback_backend: petrelic_bn254
    allow_dev_fallback_in_reportable_runs: false
  hash_output_bits: 256               # benchmark: paper requires equal-length
                                      # hash outputs, exact length unspecified
  attributes:
    # benchmark: NOT published for this evaluation. Ref[41] fixes u=30 only
    # for its own figure captions (Ref[41].md:472, "we fix the number of
    # attributes (l = 30)"), and the manuscript's §VI never sets one despite
    # declaring u, l and e in its cost-notation table.
    #
    # 10 was chosen to match zhuang_lattice_mabse.attributes.l, which WAS
    # published, so the two attribute-based baselines would be compared at the
    # same policy size. Ref[52] has since been dropped (2026-08-27) and that
    # block reduced to a status marker, so the original basis no longer exists
    # in this file -- the value is retained deliberately rather than silently
    # re-derived, because changing it now would be results-affecting and would
    # invalidate the Exp. 1/2 measurements already taken at u=10. No newer
    # published anchor exists to match against: Ref[54] does not fix an
    # attribute-universe size either. Ref[41]'s trapdoor is 2u exponentiations
    # and its search
    # is 2u+1 pairings per candidate, so this value places the baseline on
    # Exp. 1 and Exp. 2.
    u: 10                             # number of user attributes
  multi_keyword:
    # benchmark: Ref[41] is single-keyword. Its trapdoor carries exactly one
    # O_3(w_w) (Ref[41].md:328) and its search tests one keyword (:344); no
    # conjunctive form exists in the paper. A q-keyword query therefore runs
    # as q independent trapdoors and q independent searches with client-side
    # intersection — the same native-mode rule §VI (baselines) applies to Exp. 3.
    mode: independent_trapdoors

# -----------------------------------------------------------------------------
# Ref[52] — Zhuang et al. DROPPED 2026-08-27 (team decision). Not implemented as
# an active baseline; see debug_history.md for the full reasoning. Its Exp. 2
# runner never materialized a real N-record index (approximated an N-record
# scan by replaying one real entry N times), which the team judged not
# comparable on the same "build once, measure real thing" methodology every
# other scheme (including this repo's own) uses -- rather than disclose the
# approximation, the scheme was replaced with Ref[54] (see below), which is
# genuinely lattice-based/postquantum and does not have that gap. Kept as a
# related-work citation in the manuscript; removed as an empirical comparator.
# Parameters intentionally absent and NOT to be populated.
# -----------------------------------------------------------------------------
zhuang_lattice_mabse:
  status: dropped_replaced_by_ref54

# -----------------------------------------------------------------------------
# Ref[54] — Perera and Fugkeaw, "LV-PQ-ABSE", IEEE IoT-J, doi:
# 10.1109/JIOT.2026.3695855. Added 2026-08-27 to replace Ref[52] (zhuang,
# dropped above). Genuinely lattice-based throughout (LWE-hardness CP-ABE +
# Kyber768 KEM + Dilithium3 signatures, NIST Category 3 / lambda=192) -- no
# pairings, no DBDH, anywhere in the construction. See
# References/Ref[54]/Ref[54].md for the full extraction and a legitimacy
# assessment (no self-contradiction found, unlike Ref[41]).
#
# NOT YET IMPLEMENTED. Schemes/perera_lv_pqabse/ does not exist yet -- this
# block only records what the paper does and does not publish, so the gaps
# are visible before implementation starts (same rigor as
# thingom_pq_abse.attributes.u below).
perera_lv_pqabse:
  lattice:
    # NOT PUBLISHED. The paper states only "parameters (n,q,sigma) ... follow
    # established configurations consistent with Kyber768 and Dilithium3"
    # (Ref[54].md, Sec. IV.C "Lattice Parameterization and Security
    # Justification") -- no concrete (n,q,sigma) triple is given anywhere in
    # the text. Same class of gap as thingom_pq_abse's u.
    #
    # DECIDED 2026-08-29, when the scheme was implemented.
    #
    # n = 768. The paper's own anchor is "consistent with Kyber768", and
    # Kyber768's security comes from module-LWE of rank 3 over a degree-256
    # ring -- an effective LWE dimension of 3*256 = 768. This construction's
    # CP-ABE is plain (not module) LWE with G-trapdoors, so the dimension that
    # carries the same NIST Category 3 / lambda=192 claim the paper makes is
    # 768 itself. Taking Kyber's ring degree 256 as n instead would name the
    # right number for the wrong parameter and would NOT be Category 3 here.
    #
    # q = 2^22. Kyber's own q=3329 cannot be reused: this is a trapdoor
    # construction (TrapGen/SampleLeft/SamplePre), where the modulus must
    # exceed the noise accumulated over m columns or decryption fails outright.
    # A power of two keeps the gadget decomposition exact. 22 is the largest
    # exponent for which Common/crypto/lattice.py's int64 matmul guard still
    # holds at m = 2*n*log_q (m*(q-1)^2 = 2^59.0 < 2^63) -- the same overflow
    # class that silently corrupts results and was flagged for Ref[52].
    #
    # sigma = 4.0 matches the repo's existing LatticeParams default and is a
    # standard GPV sampling width for this trapdoor.
    n: 768
    m: 33792                          # 2 * n * log_q -- gadget block + uniform block
    log_q: 22                         # q = 2^22 = 4,194,304
    q: 4194304
    gaussian_sigma: 4.0
  security_parameter_lambda: 192      # published: "lambda = 192 (NIST Category 3)"
  attributes:
    # NOT PUBLISHED. No attribute universe size |U| is given anywhere in the
    # paper (unlike zhuang's published l=10).
    #
    # DECIDED 2026-08-29: 10, matching thingom_pq_abse.attributes.u so the two
    # attribute-based baselines are compared at the same policy size. That is
    # the precedent already set between thingom and the dropped zhuang, and it
    # is the choice the scheme note proposed. Not results-affecting for Exp. 1/2/3
    # (see abe_on_measured_path below), so it costs nothing to align.
    universe_size: 10
  abe_on_measured_path: false
  # MEASUREMENT BOUNDARY, decided 2026-08-29.
  #
  # Exp. 1 times trapdoor generation, which in this scheme is PRF tokenization
  # plus a Dilithium3 signature -- the paper's own headline claim (Table II:
  # O(n + T_PRF), "no lattice sampling at query time"). Exp. 2 times search
  # over the fog-side hybrid index, which holds PRF tokens, not ciphertexts.
  # Exp. 3 is d independent Exp. 2 searches. The lattice CP-ABE ciphertext
  # ct_abe is therefore read by NONE of the three; it is payload-key
  # encapsulation, consumed only by Phase 5 retrieval.
  #
  # So the Exp. 1/2/3 index build populates the searchable index and does not
  # generate a ct_abe per record. Measured cost of doing so anyway, on this
  # host at the parameters above: 758 ms per record, i.e. 21 h at N = 10^5 and
  # 211 h at N = 10^6 -- it would consume the entire 24 h track budget as
  # untimed setup while changing no measured number in either direction.
  # test_scheme.py exercises the full Phase 2 -> Phase 5 path including
  # ct_abe, so the construction is verified end to end regardless.
  kem: kyber768                       # published
  signature: dilithium3               # published
  hash: sha3-256                      # published (H1,H2,H3 domain-separated; HKDF-SHA3-256)
  symmetric: aes-256-gcm              # published
  cross_domain:
    # NOT PUBLISHED: the paper's system model has a single TA, a single fog
    # tier and no federation -- there is no multi-domain notion at all.
    # DECIDED 2026-08-29: native mode, the same rule §VI (baselines) already applies
    # to guo_vdsse and thingom_pq_abse -- d independent trapdoors, d
    # independent searches, client-side aggregation.
    mode: independent_trapdoors
  fuzzy:
    ngram_size: 3                     # benchmark: standard trigram; paper says "n-gram"
    match_threshold: 0.6              # benchmark: paper names theta, never fixes it

# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Ref[55] — Ge, Gao, Ning, Ma, Chen, IEEE Internet of Things Journal, vol. 11,
# no. 24, pp. 40861-40874, 15 Dec 2024. doi: 10.1109/JIOT.2024.3457270
#
# "Verifiable Multilevel Dynamic Searchable Encryption With Forward and
# Backward Privacy in Cloud-Assisted IoT" — schemes Peony and Peony++.
#
# Added 2026-08-28. Purely ADDITIVE: no existing value in this file changed,
# so no existing baseline result is affected.
#
# Full parameter provenance and the list of what the paper does NOT publish:
# References/Ref[55]/Ref[55].md sections 4 and 5.
#
# NOTE ON SECURITY CLASS: this is a SYMMETRIC-key construction (HMAC-SHA-256,
# AES, keccak256, GGM-PRF). It makes no post-quantum claim and needs none --
# there is no pairing or discrete-log anywhere. Cite it for verifiability and
# forward/backward privacy, NOT as a post-quantum comparison point.
# -----------------------------------------------------------------------------
yue_ge:
  # --- published ---
  access_levels: 3                    # published: Ref[55].md §4 — "three levels,
                                      # where level 3 is the highest and level 1
                                      # is the lowest" (paper §VII-A)
  bloom_filter:
    false_positive_rate: 1.0e-4       # published: "The false positive rate for
                                      # BF is p = 10^-4 in Peony++, same as
                                      # Aura" (paper §VII-A)
    num_hashes: 5                     # published as one of TWO reported settings
                                      # (h=5 and h=13, Tables V-VII). The paper
                                      # declares no default. We take h=5 as the
                                      # primary because it is the setting Aura
                                      # is compared against first in every table,
                                      # and expose h=13 via num_hashes_alt so a
                                      # sensitivity run needs no code change.
                                      # CHANGING THIS IS RESULTS-AFFECTING.
    num_hashes_alt: 13                # published: the second reported setting
    # Array size is DERIVED, not stored: b = -d*ln(p)/(ln 2)^2, published in
    # paper §VII-B. See src/params.py::bloom_array_bits(). d is the number of
    # deletions between two searches, so b is per-(keyword,level) and grows
    # with deletion volume -- it is not a fixed constant.
  deletions_between_searches: 1000    # published sweep point: the paper reports
                                      # d in {10, 100, 1000, 10000} and fixes no
                                      # default. 1000 is the value its own
                                      # Table VII singles out for the deletion
                                      # timing table, so it is the most defensible
                                      # single choice. benchmark: default only.
  file_identifier_bytes: 32           # published: "The length of a file
                                      # identifier is up to 32 bytes" (§VII-A)
  hash: sha256                        # published: OpenSSL SHA-256 (§VII-A)
  digest_hash: keccak256              # published: keccak256 for the on-chain
                                      # digests (§VII-A). Used for prooflist
                                      # entries only.
  symmetric_encryption: aes-256-gcm   # benchmark: paper says only "AES" and
                                      # never fixes a key length (Ref[55].md §5
                                      # item 1). Matched to guo_vdsse's
                                      # symmetric_encryption so the two
                                      # verifiable baselines pay the same
                                      # primitive cost (§VI (testbed) parity).

  # --- benchmark decisions: NOT published by the paper ---
  security_parameter_lambda: 128      # benchmark: never fixed numerically by the
                                      # paper (Ref[55].md §5 item 1). Matched to
                                      # guo_vdsse.security_parameter_lambda=128
                                      # so the two verifiable baselines are
                                      # compared at equal security.
  update_batches_c: 4                 # benchmark: the paper says only "we
                                      # implement batch updating; thus c is
                                      # relatively small" (§VI-D) and never fixes
                                      # it. Search is O(c) PRF evaluations, so
                                      # this is DIRECTLY RESULTS-AFFECTING.
                                      # 4 matches the repo's default domain count
                                      # d=4 (§VI (defaults)) so batch count and domain
                                      # count do not silently differ.
  puncturable_prf:
    # The GGM tree DEPTH is derived, not stored. Ref[55] §IV-B (MSRE.Enc step 1)
    # fixes the t-punc-PRF domain as the Bloom index space itself:
    #   "Calculates j_i = H_i(t) in [b] and sk_{j_i} = F(sk, j_i)"
    # so depth = ceil(log2(b)), and b is itself derived from d and p. Storing a
    # fixed wider domain here would inflate the punctured key beyond what the
    # paper's own communication-cost figures (§VII-B) imply. The derivation is
    # src/msre.py::domain_bits_for().
    #
    # The paper never states the depth explicitly (Ref[55].md §5 item 3); this
    # derivation is the reading its own Enc step forces.
    output_bits: 256                  # benchmark: full SHA-256 output
  level_assignment: pid_hash          # benchmark: the corpus carries no access
                                      # level and the paper never says how it
                                      # assigned one to Wikipedia (Ref[55].md §5
                                      # item 4). We derive it deterministically
                                      # from the record's pseudonymous patient id
                                      # so it is stable across runs and balanced
                                      # across levels. See src/levels.py.
